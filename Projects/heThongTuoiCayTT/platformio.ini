; Firmware Raspberry Pi Pico W cho he thong tuoi cay thong minh, chay tren trinh mo phong Wokwi
; (wokwi.toml + diagram.json).
;
;   pio run                      build firmware (.pio/build/picow/firmware.uf2), roi trong VS Code: F1 -> Wokwi: Start Simulator
;   pio device monitor -p rfc2217://localhost:4000      xem / go lenh Serial khi mo phong dang chay
;
; Pico W (RP2040 + Wi-Fi CYW43439) can core Arduino-Pico (earlephilhower). Nen tang raspberrypi chinh thuc cua
; PlatformIO khong co core nay, nen dung nen tang cong dong cua maxgerhardt (lan build dau se tu tai ve).
; Khong dung Pico 2 W (RP2350): Wokwi mo phong RP2350 chua chuan, LCD I2C bi loi het gio (hien ky tu la) va phep so
; sanh so thuc doi khi sai (muc nuoc nhay 77% <-> 0%). Cung chuong trinh do tren Pico W chay dung. Xem docs/wokwi.md.
; Huong dan day du: docs/wokwi.md

[platformio]
default_envs = picow

[env:picow]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
; Giu core Arduino-Pico 5.2.1. Tu ban 5.3.0, ham WiFi.begin() doi su kien Wi-Fi trong mot vong lap khong co gioi
; han thoi gian; tren Wokwi su kien do khong toi nen Pico treo o "Dang ket noi Wi-Fi" va setup() khong chay xong
; (LCD, DHT22, bom khong hoat dong). Ban 5.2.1 da thu tren Wokwi: noi Wi-Fi sau khoang 4,5 giay, toc do mo phong ~100%.
; Ban 5.2.1 can trinh bien dich pico-quick-toolchain 4.1.0. Link duoi la ban cho Windows 64-bit; tren Linux/macOS
; doi "x86_64-w64-mingw32...zip" thanh ban tuong ung trong
; https://github.com/earlephilhower/pico-quick-toolchain/releases/tag/4.1.0
platform_packages =
    framework-arduinopico@https://github.com/earlephilhower/arduino-pico/releases/download/5.2.1/rp2040-5.2.1.zip
    toolchain-rp2040-earlephilhower@https://github.com/earlephilhower/pico-quick-toolchain/releases/download/4.1.0/x86_64-w64-mingw32.arm-none-eabi-1aec55e.250530.zip
lib_deps =
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2.0
