; Firmware Raspberry Pi Pico 2 W cho he thong tuoi cay thong minh, chay tren trinh mo phong Wokwi
; (wokwi.toml + diagram.json).
;
;   pio run                      build firmware (.pio/build/pico2w/firmware.uf2), roi trong VS Code: F1 -> Wokwi: Start Simulator
;   pio device monitor -p rfc2217://localhost:4000      xem / go lenh Serial khi mo phong dang chay
;
; Pico 2 W (RP2350 + Wi-Fi CYW43439) can core Arduino-Pico (earlephilhower). Nen tang raspberrypi chinh thuc cua
; PlatformIO chua co bo nay, nen dung nen tang cong dong cua maxgerhardt (lan build dau se tu tai ve).
; Huong dan day du: docs/wokwi.md

[platformio]
default_envs = pico2w

[env:pico2w]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
lib_deps =
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2.0
