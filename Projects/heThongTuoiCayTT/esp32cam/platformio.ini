; Firmware cho ESP32-CAM (AI-Thinker): ket noi WiFi, chup anh khi laptop goi http://esp32cam.local/capture
;
; Build + nap (chay tu thu muc goc heThongTuoiCayTT):
;   pio run -d esp32cam -t upload
;   pio device monitor -d esp32cam        (xem log + dia chi IP)

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = huge_app.csv
