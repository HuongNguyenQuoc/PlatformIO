; Firmware cho ESP32-CAM (AI-Thinker): ket noi WiFi, chup anh khi laptop goi http://esp32cam.local/capture
;
; Chay tu thu muc goc heThongTuoiCayTT:
;   pio run -d esp32cam -t upload                 nap qua WiFi (env ota, mac dinh)
;   pio run -d esp32cam -e esp32cam -t upload     nap qua cap (de MB). Lan dau bat OTA phai nap cach nay
;   ./esp32cam/watch_upload.sh                    tu nap qua WiFi moi khi luu file code
;   pio device monitor -d esp32cam -e esp32cam    (xem log + dia chi IP, can cam de MB)

[platformio]
default_envs = ota
extra_configs = secrets.ini  ; Mat khau OTA, copy tu secrets.example.ini

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; 2 vung app 1.9MB de nap qua WiFi (huge_app.csv chi co 1 vung nen khong OTA duoc)
board_build.partitions = min_spiffs.csv
build_flags = '-DOTA_PASSWORD="${ota.password}"'

[env:ota]
extends = env:esp32cam
upload_protocol = espota
upload_port = esp32cam.local  ; Neu laptop khong tim thay ten nay thi thay bang IP, vd 192.168.100.102
upload_flags = --auth=${ota.password}
